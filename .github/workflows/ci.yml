name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    name: Validate and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.7'
      - run: python scripts/package.py check
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package.py build
      - name: Validate with Claude
        run: |
          npm exec --yes --package=@anthropic-ai/claude-code@2.1.291 -- claude plugin validate ./plugins/openorange --strict
          npm exec --yes --package=@anthropic-ai/claude-code@2.1.291 -- claude plugin validate . --strict
